<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在庫を減らす（スタッフ用）</title>
<link rel="manifest" href="app-staff.webmanifest">
<meta name="theme-color" content="#15201d">
<meta name="mobile-web-app-capable" content="no">
<meta name="apple-mobile-web-app-capable" content="no">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="在庫スタッフ">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f5f5;--card:#ffffff;--soft:#eef0f0;--line:#e4e7e7;--line2:#d2d7d7;
  --ink:#15201d;--ink2:#4c5552;--ink3:#5f6b67;
  --akb:#285f9c;--good:#0c6a4e;--bad:#b3331d;--warn:#985a0f;--hot:#c2410c;
  --dark:#15201d;--dark2:#1c2b27;
  --r:14px;--r-sm:9px;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Noto Sans JP','Inter',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;padding:1.25rem 1rem 3rem;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.page{max-width:620px;margin:0 auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{font-size:19px;font-weight:700}
.conn{font-size:12px;padding:5px 11px;border-radius:20px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.conn.ok{background:#d9efe6;color:var(--good)}
.conn.bad{background:#fbe4df;color:var(--bad)}
.conn .dot{width:8px;height:8px;border-radius:50%;background:currentColor}

.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;font-size:15px;padding:12px;border:1.5px solid var(--line2);border-radius:24px;background:var(--soft);color:var(--ink2);cursor:pointer;text-align:center;min-height:48px;font-weight:500}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.15rem;margin-bottom:14px}
.panel.sel{border:2px solid var(--bad);box-shadow:0 4px 18px rgba(179,51,29,.12)}
.label{font-size:13px;color:var(--ink2);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.label .sub{font-weight:400;color:var(--ink3);font-size:12px}

.store-select{display:flex;gap:8px}
.store-pill{flex:1;font-size:16px;padding:13px 8px;border:2px solid var(--line2);border-radius:var(--r-sm);background:var(--soft);color:var(--ink2);cursor:pointer;text-align:center;min-height:52px;font-weight:600}
.store-pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* 売れ筋 chips */
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{position:relative;display:flex;flex-direction:column;gap:3px;border:2px solid var(--line2);background:var(--card);border-radius:12px;padding:11px 12px 11px 34px;cursor:pointer;text-align:left;min-height:60px}
.chip:active{background:var(--soft)}
.chip .rank{position:absolute;left:8px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--hot);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.chip.top1 .rank{background:#b8860b}.chip.top2 .rank{background:#7d7d7d}.chip.top3 .rank{background:#a0623b}
.chip .cn{font-weight:600;font-size:14px;line-height:1.25}
.chip .cmeta{font-size:11.5px;color:var(--ink3);display:flex;justify-content:space-between;gap:6px;font-family:var(--mono)}
.chip .cmeta .st{color:var(--ink2)}
.chip .cmeta .st.neg{color:var(--bad)}

/* タップリスト */
.searchbar{position:relative;margin-bottom:10px}
.searchbar .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--ink3)}
.searchbar input{padding-left:44px}
.catrow{display:flex;gap:8px;margin-bottom:10px}
.catrow select{flex:1;min-width:0;font-size:15px;padding:11px 12px;border:1.5px solid var(--line2);border-radius:var(--r-sm);background:var(--card);color:var(--ink);font-family:var(--sans);cursor:pointer}
.item-cat{display:inline-block;font-size:11.5px;background:#e7efe9;color:var(--good);padding:2px 9px;border-radius:20px;margin-top:5px;font-weight:600}
.picklist{max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.pick{display:flex;align-items:center;gap:10px;padding:12px 13px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--card)}
.pick:last-child{border-bottom:none}
.pick:active{background:var(--soft)}
.pick .pn{flex:1;font-weight:500;font-size:15px;line-height:1.3}
.pick .pn small{display:block;color:var(--ink3);font-size:11px;font-family:var(--mono);margin-top:1px}
.pick .pq{font-family:var(--mono);font-weight:600;font-size:15px;white-space:nowrap}
.pick .pq.zero{color:var(--ink3);font-weight:400}
.pick .pq.neg{color:var(--bad)}

.divider{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:12px;margin:14px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

#reader{width:100%;border-radius:var(--r-sm);overflow:hidden;margin:10px 0;background:#000}
#reader:empty{display:none}

.btn{font-family:inherit;font-size:16px;font-weight:600;padding:15px;min-height:56px;border-radius:var(--r-sm);border:2px solid var(--line2);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn:active{transform:translateY(1px)}
.btn.scan{background:var(--akb);color:#fff;border-color:var(--akb)}
.btn.sell{background:var(--bad);color:#fff;border-color:var(--bad);font-size:19px;min-height:70px}
.btn.ghost{background:transparent;font-size:14px;min-height:46px;color:var(--ink2)}
.btn:disabled{opacity:.5}
.btn-row{display:flex;gap:10px;margin-top:10px}

input[type=text],input[type=number],input[type=search]{font-family:inherit;font-size:17px;padding:13px;min-height:52px;border:2px solid var(--line2);border-radius:var(--r-sm);background:var(--soft);width:100%;outline:none}
input.jan,input[type=number]{font-family:var(--mono)}
input:focus{border-color:var(--akb)}

.rname{font-size:21px;font-weight:700;line-height:1.3;margin-bottom:4px}
.rmeta{font-size:13px;color:var(--ink3);font-family:var(--mono);margin-bottom:12px}
.qtybox{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--soft);border-radius:var(--r-sm);padding:14px;margin-bottom:14px}
.qtybox .cur{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1}
.qtybox .cur.neg{color:var(--bad)}
.qtybox .lab{font-size:14px;color:var(--ink2)}
.qstep{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:14px}
.qstep button{width:52px;height:52px;border-radius:50%;border:2px solid var(--line2);background:var(--card);font-size:24px;font-weight:700;cursor:pointer;color:var(--ink)}
.qstep .qv{font-family:var(--mono);font-size:26px;font-weight:600;min-width:44px;text-align:center}
.msg{font-size:14px;padding:12px 14px;border-radius:var(--r-sm);margin-top:10px;line-height:1.6}
.msg.new{background:#fdeccf;color:var(--warn);font-weight:600}

.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.9rem 1rem;margin-bottom:9px}
.item-name{font-size:16px;font-weight:600}
.item-meta{font-size:12px;color:var(--ink3);font-family:var(--mono);margin-top:2px}
.srow{display:flex;align-items:center;gap:9px;font-size:14px;padding:7px 10px;background:var(--soft);border-radius:var(--r-sm);margin-top:6px}
.srow .sdot{width:9px;height:9px;border-radius:50%}
.srow .sname{font-weight:500;min-width:70px}
.srow .sqty{font-family:var(--mono);font-weight:600}
.srow .sqty.zero{color:var(--ink3);font-weight:400}.srow .sqty.neg{color:var(--bad)}
.srow .sshelf{margin-left:auto;font-size:12px;color:var(--ink2);background:var(--card);border:1px solid var(--line);padding:3px 9px;border-radius:16px}
.srow .sshelf:empty{display:none}
.empty{text-align:center;color:var(--ink3);padding:1.6rem 1rem}
.empty .big{font-size:30px;margin-bottom:6px}

.foot{text-align:center;font-size:12px;color:var(--ink3);margin-top:20px;line-height:1.7}

/* 売上レポート */
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:72px;font-family:inherit;font-size:14px;font-weight:600;padding:10px;min-height:44px;border:1.5px solid var(--line2);border-radius:20px;background:var(--soft);color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:11px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.day-date{font-weight:700;font-size:15px}
.day-date small{font-weight:400;color:var(--ink3);font-size:12px;margin-left:6px}
.day-total{font-family:var(--mono);font-weight:600;font-size:14px;color:var(--bad)}
.drow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:14px}
.drow:last-child{border-bottom:none}
.drow .dn{flex:1;line-height:1.3}
.drow .dn small{display:block;color:var(--ink3);font-size:11px}
.drow .dstore{font-size:11px;color:var(--ink2);background:var(--soft);border:1px solid var(--line);padding:2px 8px;border-radius:14px;white-space:nowrap}
.drow .dq{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--bad);min-width:44px;text-align:right}
.rep-sum{font-size:13px;color:var(--ink2);margin-bottom:12px;padding:10px 12px;background:var(--soft);border-radius:var(--r-sm)}
.rep-sum b{font-family:var(--mono);color:var(--ink)}

.toast{position:fixed;bottom:max(22px,calc(env(safe-area-inset-bottom) + 14px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:15px;padding:14px 20px;border-radius:24px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,.25);max-width:93vw;display:flex;align-items:center;gap:12px}
.offline-banner{position:fixed;top:0;left:0;right:0;background:var(--bad);color:#fff;font-size:14px;font-weight:600;text-align:center;padding:12px;z-index:300}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast.err{background:var(--bad)}.toast.warn{background:var(--warn)}.toast.ok{background:var(--good)}
.toast button{background:rgba(255,255,255,.25);border:none;color:#fff;font-family:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:16px;cursor:pointer;white-space:nowrap}
.recent{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
.recent:last-child{border-bottom:none}
.recent .rc-t{font-family:var(--mono);font-size:12px;color:var(--ink3);min-width:40px}
.recent .rc-n{flex:1;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent .rc-q{font-family:var(--mono);font-weight:600;color:var(--bad)}
.recent .rc-undo{background:var(--soft);border:1.5px solid var(--line2);color:var(--ink2);font-family:inherit;font-size:13px;font-weight:600;padding:8px 12px;min-height:40px;border-radius:16px;cursor:pointer;white-space:nowrap}
.recent .rc-undo:active{background:var(--line)}
.hide{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media(max-width:400px){.chips{grid-template-columns:1fr}}

/* ===== 質感アップ ===== */
.tab,.store-pill,.chip,.pick{transition:transform .06s ease,background .15s,border-color .15s,color .15s}
.tab:active,.store-pill:active,.chip:active{transform:translateY(1px)}

/* ===== ダークモード ===== */
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0e1412;--card:#18211d;--soft:#1f2a25;--line:#2a352f;--line2:#384741;
    --ink:#e9efec;--ink2:#b6c2bc;--ink3:#8ea099;
  }
  .tab.active,.store-pill.on{background:#127a5b;border-color:#127a5b;color:#fff}
  .item-cat{background:rgba(84,196,147,.16);color:#90e0bb}
  .conn.ok{background:rgba(84,196,147,.16);color:#77dcae}
  .conn.bad{background:rgba(240,137,122,.16);color:#f2a99b}
  .msg.new{background:rgba(227,171,92,.16);color:#e8bd7c}
  /* 赤系テキストはダーク背景で少し明るく */
  .srow .sqty.neg,.recent .rc-q,.qtybox .cur.neg,.pick .pq.neg,.chip .cmeta .st.neg{color:#f2a99b}
}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>📦 在庫を減らす</h1>
    <span class="conn bad" id="conn"><span class="dot"></span><span id="connText">接続中…</span></span>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="sell">➖ 売れた</div>
    <div class="tab" data-tab="find">🔍 在庫</div>
    <div class="tab" data-tab="report">📊 売上</div>
  </div>

  <!-- SELL -->
  <section id="tab-sell">
    <div class="panel">
      <span class="label">いまいる店舗</span>
      <div class="store-select" id="storeSel"></div>
    </div>

    <!-- 選択中の商品（タップ/スキャンで表示） -->
    <div class="panel sel hide" id="sellPanel"><div id="result"></div></div>

    <!-- 直近の売上（その場で取り消し可） -->
    <div class="panel hide" id="recentPanel">
      <span class="label">🕘 直近の売上 <span class="sub">押し間違いはここで取り消せます（本日・締め前）</span></span>
      <div id="recentSales"></div>
    </div>

    <!-- 売れ筋 -->
    <div class="panel" id="topPanel">
      <span class="label">🔥 売れ筋 <span class="sub">よく売れる商品（タップで選択）</span></span>
      <div id="topSellers"></div>
    </div>

    <!-- 商品をタップで選ぶ -->
    <div class="panel">
      <span class="label">🗂 商品をタップで選ぶ</span>
      <div class="catrow"><select id="pickCat1"></select><select id="pickCat2"></select></div>
      <div class="searchbar"><span class="mag">🔍</span><input type="search" id="pickSearch" placeholder="絞り込み（タイトル・機種・店内コード）…" autocomplete="off"></div>
      <div class="picklist" id="pickList"></div>
      <div class="divider">スキャン / 手入力でもOK</div>
      <button class="btn scan" id="scanBtn">📷 バーコードを読み取る</button>
      <div class="btn-row hide" id="scanStopRow"><button class="btn ghost" id="scanStop">⏹ カメラを止める</button></div>
      <div id="reader"></div>
      <input type="text" class="jan" id="janInput" placeholder="バーコード / 店内コードを手入力" style="margin-top:10px">
    </div>
  </section>

  <!-- FIND -->
  <section id="tab-find" class="hide">
    <div class="searchbar"><span class="mag">🔍</span>
      <input type="search" id="findInput" placeholder="タイトル・機種・JAN・店内コードで検索…" autocomplete="off"></div>
    <div id="findResults"></div>
  </section>

  <!-- REPORT (売上) -->
  <section id="tab-report" class="hide">
    <div class="panel">
      <span class="label">📊 売上の記録 <span class="sub">何が・いつ・何個 売れたか</span></span>
      <div class="seg" id="repPeriod">
        <button data-d="0" class="on">今日</button>
        <button data-d="6">7日間</button>
        <button data-d="29">30日間</button>
      </div>
      <div class="seg" id="repStore" style="margin-top:8px"></div>
    </div>
    <div id="repResult"></div>
  </section>

  <div class="foot">在庫データは店長のPCと共有されています。<br>入荷や修正は店長にお願いしてください。</div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const SB_URL="https://kqkfbulbravvtepqfbiu.supabase.co";
const SB_KEY="sb_publishable_y435jKLlmTVGD2MTM9wrBg_S9ombPgm";
if(typeof supabase==="undefined"||!supabase.createClient){
  document.body.insertAdjacentHTML("afterbegin",'<div class="offline-banner">アプリの読み込みに失敗しました。通信環境をご確認のうえ、ページを再読み込みしてください。</div>');
  throw new Error("supabase-js failed to load");
}
const sb=supabase.createClient(SB_URL,SB_KEY);

const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let STORES=[],PRODUCTS=[],STOCK={},TOP=[],RECENT=[],selJan=null,sellQty=1,pollTimer=null;
let repDays=0,repStore="";  // 売上レポート: 期間(日数)・店舗フィルタ
function jstToday(){ return new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Tokyo"}); }
function addDays(ds,n){ const d=new Date(ds+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }

function actor(){ return localStorage.getItem("inv_actor")||""; }
function storeName(id){const s=STORES.find(x=>x.id===id);return s?s.name:"?";}
function qtyAt(pid,sid){return (STOCK[sid]&&STOCK[sid][pid]&&STOCK[sid][pid].qty)||0;}
function shelfAt(pid,sid){return (STOCK[sid]&&STOCK[sid][pid]&&STOCK[sid][pid].shelf)||"";}
function productByJan(j){return PRODUCTS.find(p=>p.jan===j);}
function productByCode(c){c=(c||"").trim();return c?PRODUCTS.find(p=>(p.internal_code||"")===c):null;}
function findProduct(v){return productByJan((v||"").trim())||productByCode(v);}
function productById(id){return PRODUCTS.find(p=>p.id===id);}
function catList1(){return [...new Set(PRODUCTS.map(p=>(p.cat1||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja"));}
function catList2(c1){return [...new Set(PRODUCTS.filter(p=>!c1||(p.cat1||"")===c1).map(p=>(p.cat2||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja"));}
function fillSelect(el,arr,cur,allLabel){ if(!el)return; const keep=arr.includes(cur)?cur:"";
  el.innerHTML=`<option value="">${esc(allLabel)}</option>`+arr.map(v=>`<option value="${esc(v)}"${v===keep?" selected":""}>${esc(v)}</option>`).join(""); el.value=keep; }
function fillPickCats(){ const s1=$("#pickCat1"),s2=$("#pickCat2"); if(!s1)return;
  fillSelect(s1,catList1(),s1.value||"","すべての大分類"); fillSelect(s2,catList2(s1.value||""),(s2||{}).value||"","すべての小分類"); }
function curStoreId(){ let c=localStorage.getItem("inv_staff_store"); if(!STORES.find(s=>s.id===c)) c=STORES[0]&&STORES[0].id; return c; }

let toastT;
function toast(msg,kind,label,fn){
  const t=$("#toast"); t.className="toast show"+(kind?(" "+kind):""); t.innerHTML="<span>"+esc(msg)+"</span>";
  if(label){const b=document.createElement("button");b.textContent=label;b.onclick=()=>{t.className="toast";if(fn)fn();};t.appendChild(b);}
  clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast", label?6000:2600);
}
function errMsg(e){return (e&&(e.message||e.hint||e.details))||"通信エラー";}
function setConn(ok){$("#conn").className="conn "+(ok?"ok":"bad");$("#connText").textContent=ok?"接続OK":"未接続";}

async function loadAll(){
  try{
    const [st,pr,sk,tp,rc]=await Promise.all([
      sb.from("inv_stores").select("*").order("sort"),
      sb.from("inv_products").select("*"),
      sb.from("inv_stock").select("store_id,product_id,qty,shelf"),
      sb.rpc("inv_top_sellers",{p_days:30,p_limit:10}),
      sb.from("inv_movements").select("id,store_id,product_id,delta,created_at")
        .eq("type","out").eq("undone",false).eq("day_closed",false).eq("business_date",jstToday())
        .order("id",{ascending:false}).limit(40),
    ]);
    if(st.error)throw st.error; if(pr.error)throw pr.error; if(sk.error)throw sk.error;
    STORES=st.data||[]; PRODUCTS=pr.data||[]; TOP=(tp&&!tp.error&&tp.data)?tp.data:[];
    RECENT=(rc&&!rc.error&&rc.data)?rc.data:[];
    STOCK={}; STORES.forEach(s=>STOCK[s.id]={});
    (sk.data||[]).forEach(r=>{(STOCK[r.store_id]=STOCK[r.store_id]||{})[r.product_id]={qty:r.qty,shelf:r.shelf};});
    setConn(true); renderStores(); renderTop(); fillPickCats(); renderPick(); renderFind(); renderRepStores(); renderRecent();
    if(selJan) showProduct(selJan,true);
    if(!$("#tab-report").classList.contains("hide")) loadReport();
    return true;
  }catch(e){ setConn(false); toast("読み込み失敗："+errMsg(e),"err"); return false; }
}

/* 店舗選択 */
function renderStores(){
  const el=$("#storeSel"); el.innerHTML=""; const cur=curStoreId();
  STORES.forEach(s=>{ const b=document.createElement("button");
    b.className="store-pill"+(s.id===cur?" on":""); b.textContent=s.name;
    b.onclick=()=>{ localStorage.setItem("inv_staff_store",s.id); renderStores(); renderTop(); renderPick(); renderRecent(); if(selJan) showProduct(selJan,true); };
    el.appendChild(b);
  });
}

/* 売れ筋 */
function renderTop(){
  const el=$("#topSellers"); const sid=curStoreId();
  if(!TOP.length){ el.className=""; el.innerHTML=`<div class="empty" style="padding:1rem"><div class="big">🔥</div>まだ売上データがありません。<br>売れると自動でここに並びます。</div>`; return; }
  el.className="chips"; el.innerHTML="";
  TOP.forEach((t,i)=>{ const qy=qtyAt(t.product_id,sid);
    const b=document.createElement("div"); b.className="chip"+(i<3?(" top"+(i+1)):"");
    b.innerHTML=`<span class="rank">${i+1}</span><span class="cn">${esc(t.name)}</span>
      <span class="cmeta"><span>${t.model?esc(t.model):"&nbsp;"}</span><span class="st ${qy<=0?'neg':''}">在庫${qy}</span></span>`;
    b.onclick=()=>selectProduct(t.jan); el.appendChild(b);
  });
}

/* 直近の売上（その場で取り消し可） */
function renderRecent(){
  const el=$("#recentSales"); const panel=$("#recentPanel"); const sid=curStoreId();
  const list=(RECENT||[]).filter(m=>m.store_id===sid).slice(0,8);
  if(!list.length){ panel.classList.add("hide"); el.innerHTML=""; return; }
  panel.classList.remove("hide"); el.innerHTML="";
  list.forEach(m=>{
    const p=productById(m.product_id)||{name:"(不明)"};
    let t=""; try{ t=new Date(m.created_at).toLocaleTimeString("ja-JP",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit"}); }catch(e){}
    const row=document.createElement("div"); row.className="recent";
    row.innerHTML=`<span class="rc-t">${esc(t)}</span><span class="rc-n">${esc(p.name)}</span><span class="rc-q">−${-m.delta}</span>`;
    const b=document.createElement("button"); b.className="rc-undo"; b.textContent="取り消し";
    b.onclick=()=>undo(m.id);
    row.appendChild(b); el.appendChild(row);
  });
}

/* タップで選ぶ 全商品リスト */
function renderPick(){
  const q=($("#pickSearch").value||"").trim().toLowerCase(); const el=$("#pickList"); const sid=curStoreId();
  const c1=($("#pickCat1")||{}).value||"", c2=($("#pickCat2")||{}).value||"";
  let list=PRODUCTS.slice();
  if(c1) list=list.filter(p=>(p.cat1||"")===c1);
  if(c2) list=list.filter(p=>(p.cat2||"")===c2);
  if(q) list=list.filter(p=>(p.name||"").toLowerCase().includes(q)||(p.model||"").toLowerCase().includes(q)||(p.jan||"").includes(q)||(p.internal_code||"").toLowerCase().includes(q)||(p.cat1||"").toLowerCase().includes(q)||(p.cat2||"").toLowerCase().includes(q));
  list.sort((a,b)=>(a.name||"").localeCompare(b.name||"","ja"));
  if(!list.length){ el.innerHTML=`<div class="empty"><div class="big">📦</div>${(q||c1||c2)?"見つかりません":"商品がありません（店長が入荷登録すると出ます）"}</div>`; return; }
  el.innerHTML="";
  list.slice(0,300).forEach(p=>{ const qy=qtyAt(p.id,sid);
    const cat=[p.cat1,p.cat2].map(x=>(x||"").trim()).filter(Boolean).join(" › ");
    const sub=[cat,p.model,p.internal_code?"店内 "+p.internal_code:"",p.jan].filter(Boolean).join(" ／ ");
    const d=document.createElement("div"); d.className="pick";
    d.innerHTML=`<span class="pn">${esc(p.name)}<small>${esc(sub)}</small></span>
      <span class="pq ${qy===0?'zero':''} ${qy<0?'neg':''}">${qy}点</span>`;
    d.onclick=()=>selectProduct(p.jan); el.appendChild(d);
  });
}
$("#pickSearch").addEventListener("input",renderPick);
$("#pickCat1").addEventListener("change",()=>{ fillPickCats(); renderPick(); });
$("#pickCat2").addEventListener("change",renderPick);

/* 商品選択 → 売るパネル表示 */
function selectProduct(jan){ selJan=jan; showProduct(jan); const p=$("#sellPanel");
  p.scrollIntoView({behavior:"smooth",block:"start"}); }
function onJan(j){ j=(j||"").trim(); $("#janInput").value=""; if(!j) return; const p=findProduct(j); selectProduct(p?p.jan:j); }
function showProduct(jan,keepScroll){
  jan=(jan||"").trim(); const panel=$("#sellPanel"); const box=$("#result"); const p=productByJan(jan);
  if(!jan||!p){ if(!p&&jan){ panel.classList.remove("hide"); box.innerHTML=`<div class="msg new">この商品（JAN ${esc(jan)}）は未登録です。店長に入荷登録をお願いしてください。</div>`; } else panel.classList.add("hide"); return; }
  panel.classList.remove("hide");
  if(!keepScroll) sellQty=1;
  const sid=curStoreId(); const qy=qtyAt(p.id,sid);
  box.innerHTML=`
    <div class="rname">${esc(p.name)}</div>
    <div class="rmeta">${p.model?esc(p.model)+" ／ ":""}JAN ${esc(p.jan)}${p.internal_code?" ／ 店内 "+esc(p.internal_code):""}</div>
    <div class="qtybox"><span class="lab">${esc(storeName(sid))}の在庫</span><span class="cur ${qy<0?'neg':''}">${qy}</span><span class="lab">点</span></div>
    <span class="label">売れた数</span>
    <div class="qstep"><button id="qMinus">−</button><span class="qv" id="qv">${sellQty}</span><button id="qPlus">＋</button></div>
    <button class="btn sell" id="sellDo">➖ <b style="font-weight:700">${esc(storeName(sid))}</b>で「売れた」（在庫を減らす）</button>
    <button class="btn ghost" id="sellCancel" style="margin-top:8px">キャンセル</button>`;
  $("#qMinus").onclick=()=>{ sellQty=Math.max(1,sellQty-1); $("#qv").textContent=sellQty; };
  $("#qPlus").onclick=()=>{ sellQty=sellQty+1; $("#qv").textContent=sellQty; };
  $("#sellDo").onclick=()=>doSell(p);
  $("#sellCancel").onclick=()=>{ selJan=null; panel.classList.add("hide"); };
}
async function doSell(p){
  const sid=curStoreId();
  $("#sellDo").disabled=true;
  const {data,error}=await sb.rpc("inv_record_sale",{p_store:sid,p_jan:p.jan,p_qty:sellQty,p_actor:actor()});
  if(error){ $("#sellDo").disabled=false; await loadAll();
    toast("記録できたか確認できませんでした。在庫を確認してください（通信状況もご確認を）","err"); return; }
  if(!data){ $("#sellDo").disabled=false; toast("応答が不正です。在庫を確認してください","err"); return; }
  const after=data.qty_after,mid=data.movement_id;
  selJan=null; $("#sellPanel").classList.add("hide");
  await loadAll();
  if(data.short) toast(`記録しました（残り ${after} 点）。在庫0以下です。店長に確認を`,"warn","取り消し",()=>undo(mid));
  else toast(`${storeName(sid)}：「${p.name}」−${sellQty} → 残り ${after} 点`,"ok","取り消し",()=>undo(mid));
}
async function undo(mid){
  const {data,error}=await sb.rpc("inv_undo_sale",{p_movement_id:mid,p_actor:actor()});
  if(error){ toast(errMsg(error),"err"); return; }
  await loadAll(); toast("取り消しました（在庫 "+((data&&data.qty_after)!=null?data.qty_after:"?")+" 点）","ok");
}
$("#janInput").addEventListener("change",e=>onJan(e.target.value));
$("#janInput").addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();onJan(e.target.value);} });

/* 在庫を調べる */
function renderFind(){
  const q=($("#findInput").value||"").trim().toLowerCase(); const box=$("#findResults"); box.innerHTML="";
  let list=PRODUCTS.slice();
  if(q) list=list.filter(p=>(p.name||"").toLowerCase().includes(q)||(p.model||"").toLowerCase().includes(q)||(p.jan||"").includes(q)||(p.internal_code||"").toLowerCase().includes(q)||(p.cat1||"").toLowerCase().includes(q)||(p.cat2||"").toLowerCase().includes(q));
  list.sort((a,b)=>(a.name||"").localeCompare(b.name||"","ja"));
  if(!list.length){ box.innerHTML=`<div class="empty"><div class="big">📦</div>${q?"見つかりませんでした":"商品がまだありません"}</div>`; return; }
  list.slice(0,120).forEach(p=>{
    let rows=""; STORES.forEach(s=>{const qy=qtyAt(p.id,s.id),sh=shelfAt(p.id,s.id);
      rows+=`<div class="srow"><span class="sdot" style="background:${esc(s.color)}"></span><span class="sname">${esc(s.name)}</span>
        <span class="sqty ${qy===0?'zero':''} ${qy<0?'neg':''}">${qy} 点</span><span class="sshelf">${sh?'📍 '+esc(sh):''}</span></div>`;});
    const cat=[p.cat1,p.cat2].map(x=>(x||"").trim()).filter(Boolean).join(" › ");
    const d=document.createElement("div"); d.className="item";
    d.innerHTML=`<div class="item-name">${esc(p.name)}</div><div class="item-meta">${p.model?esc(p.model)+" ／ ":""}JAN ${esc(p.jan)}${p.internal_code?" ／ 店内 "+esc(p.internal_code):""}</div>${cat?`<span class="item-cat">${esc(cat)}</span>`:""}${rows}`;
    box.appendChild(d);
  });
}
$("#findInput").addEventListener("input",renderFind);

/* 売上レポート */
function renderRepStores(){
  const el=$("#repStore"); if(!el) return; el.innerHTML="";
  const mk=(id,label)=>{ const b=document.createElement("button"); b.textContent=label;
    b.className=(repStore===id?"on":""); b.onclick=()=>{ repStore=id; renderRepStores(); loadReport(); }; el.appendChild(b); };
  mk("","全店");
  STORES.forEach(s=>mk(s.id,s.name));
}
$("#repPeriod").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return;
  repDays=parseInt(b.dataset.d,10)||0;
  $$("#repPeriod button").forEach(x=>x.classList.toggle("on",x===b)); loadReport(); });

async function loadReport(){
  const box=$("#repResult"); box.innerHTML=`<div class="empty">読み込み中…</div>`;
  const to=jstToday(), from=addDays(to,-repDays);
  const {data,error}=await sb.rpc("inv_sales_report",{p_from:from,p_to:to,p_store:repStore||null});
  if(error){ box.innerHTML=`<div class="empty">読み込み失敗：${esc(errMsg(error))}</div>`; return; }
  const rows=data||[];
  if(!rows.length){ box.innerHTML=`<div class="empty"><div class="big">🧾</div>この期間の売上記録はありません。</div>`; return; }
  // 日付ごとにまとめる
  const byDate={}; let grand=0;
  rows.forEach(r=>{ (byDate[r.business_date]=byDate[r.business_date]||[]).push(r); grand+=r.sold; });
  const dates=Object.keys(byDate).sort().reverse();
  const wd=["日","月","火","水","木","金","土"];
  let html=`<div class="rep-sum">期間合計 <b>${grand}</b> 点（${dates.length} 日）${repStore?" ／ "+esc(storeName(repStore)):" ／ 全店"}</div>`;
  dates.forEach(d=>{
    const list=byDate[d]; const dtot=list.reduce((a,r)=>a+r.sold,0);
    const dow=wd[new Date(d+"T00:00:00Z").getUTCDay()];
    html+=`<div class="day"><div class="day-head"><span class="day-date">${esc(d)}<small>(${dow})</small></span><span class="day-total">計 ${dtot} 点</span></div>`;
    list.forEach(r=>{
      html+=`<div class="drow"><span class="dn">${esc(r.name)}${r.model?`<small>${esc(r.model)}</small>`:""}</span>`+
        (repStore?"":`<span class="dstore">${esc(storeName(r.store_id))}</span>`)+
        `<span class="dq">${r.sold}</span></div>`;
    });
    html+=`</div>`;
  });
  box.innerHTML=html;
}

/* タブ */
$$(".tab").forEach(t=>t.addEventListener("click",()=>{
  $$(".tab").forEach(x=>x.classList.remove("active")); t.classList.add("active");
  $("#tab-sell").classList.toggle("hide",t.dataset.tab!=="sell");
  $("#tab-find").classList.toggle("hide",t.dataset.tab!=="find");
  $("#tab-report").classList.toggle("hide",t.dataset.tab!=="report");
  stopScan();
  if(t.dataset.tab==="report") loadReport();
}));

/* スキャナー */
let scanner=null;
const FMT=(typeof Html5QrcodeSupportedFormats!=="undefined")?[
  Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,
  Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,
  Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.QR_CODE]:undefined;
function scanErrMsg(err){
  const s=((err&&(err.name||""))+" "+(err&&(err.message||"")));
  if(/NotAllowed|Permission|denied/i.test(s)) return "カメラの使用が許可されていません。ブラウザ設定でこのサイトのカメラを『許可』にして、もう一度お試しください。";
  if(/NotFound|Overconstrained|no ?camera|Requested device/i.test(s)) return "背面カメラが見つかりませんでした。下の番号入力をお使いください。";
  if(/NotReadable|TrackStart|in use|Could not start/i.test(s)) return "カメラが他のアプリで使用中です。他アプリを閉じて、もう一度お試しください。";
  return "カメラを起動できませんでした。下の番号入力をお使いください（ホーム画面アプリで出る場合はSafari/Chromeで開くと直ることがあります）。";
}
async function startScan(){
  const fail=(msg)=>{ toast(msg,"err"); $("#scanBtn").classList.remove("hide"); $("#scanStopRow").classList.add("hide"); scanner=null; };
  if(typeof Html5Qrcode==="undefined"){ return fail("スキャナーの読込に失敗しました。ページを再読み込みしてください（通信環境をご確認ください）。"); }
  if(!window.isSecureContext||!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ return fail("この画面ではカメラを使えません。下の番号入力をお使いください。"); }
  stopScan();
  $("#scanBtn").classList.add("hide"); $("#scanStopRow").classList.remove("hide");
  scanner=new Html5Qrcode("reader",{formatsToSupport:FMT,verbose:false});
  let cam={facingMode:"environment"};
  try{ const cams=await Html5Qrcode.getCameras();
       if(cams&&cams.length){ const b=cams.find(c=>/back|rear|environment|背面|外側|後/i.test(c.label||""))||cams[cams.length-1]; if(b&&b.id) cam=b.id; } }
  catch(e){ return fail(scanErrMsg(e)); }
  try{ await scanner.start(cam,{fps:10,qrbox:{width:260,height:150}},
        dec=>{ selectProduct(dec.trim()); if(navigator.vibrate)navigator.vibrate(80); stopScan(); }, ()=>{}); }
  catch(e){ fail(scanErrMsg(e)); }
}
function stopScan(){ $("#scanBtn").classList.remove("hide"); $("#scanStopRow").classList.add("hide");
  if(scanner){const s=scanner;scanner=null;s.stop().then(()=>s.clear()).catch(()=>{});} }
$("#scanBtn").addEventListener("click",startScan);
$("#scanStop").addEventListener("click",stopScan);

window.addEventListener("focus",()=>loadAll());
(async function(){ if(await loadAll()){ pollTimer=setInterval(()=>{ if(document.visibilityState==="visible") loadAll(); },20000); } })();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
