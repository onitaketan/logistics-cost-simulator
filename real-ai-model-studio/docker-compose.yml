services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rams
      POSTGRES_PASSWORD: rams
      POSTGRES_DB: rams
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rams:rams@postgres:5432/rams
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
