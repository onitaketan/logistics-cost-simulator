services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rams
      POSTGRES_PASSWORD: rams
      POSTGRES_DB: rams
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # initdb runs *.sql alphabetically, so all migrations apply in order.
      - ./apps/api/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rams:rams@postgres:5432/rams
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build: ./apps/api
    command: celery -A app.workers.celery_app worker -l info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rams:rams@postgres:5432/rams
      REDIS_URL: redis://redis:6379/0
      # Run jobs for real (not inline): consume from the Redis broker.
      CELERY_TASK_ALWAYS_EAGER: "false"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
