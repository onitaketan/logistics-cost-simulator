# Full local stack: postgres + redis + api + worker + web.
#
#   docker compose up --build
#
# No .env file is required — every value below has a working local default. The
# api container applies migrations + seeds on boot (idempotent), then serves on
# :8000; the web frontend serves on :3000 and talks to the api. Async generation
# is exercised for real: the api enqueues to Redis (eager=false) and the worker
# consumes. api and worker share a persistent named volume for local storage so
# generated bytes written by the worker are visible to the api's /files endpoint.
#
# For real deployments, override secrets/keys via `docker compose` env or an
# override file — do NOT ship the dev API_SECRET_KEY below.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rams
      POSTGRES_PASSWORD: rams
      POSTGRES_DB: rams
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rams -d rams"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      APP_ENV: local
      API_SECRET_KEY: dev-local-secret-change-me
      # For LAN access from other PCs, override with the host's IP, e.g.
      #   CORS_ORIGINS=http://192.168.1.20:3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgresql+psycopg://rams:rams@postgres:5432/rams
      REDIS_URL: redis://redis:6379/0
      # Real async: enqueue to Redis; the worker consumes (not inline).
      CELERY_TASK_ALWAYS_EAGER: "false"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Local storage root, backed by a shared named volume (see below).
      STORAGE_PROVIDER: local
      STORAGE_DIR: /app/storage
      # AI engine: pass-through from the host shell so no YAML edit (and no key
      # written to a file) is needed to switch to real generation:
      #   AI_ENGINE=openai OPENAI_API_KEY=sk-... docker compose up
      # Defaults to the billing-free mock engine. Empty values are treated as
      # "unset" by the adapters, so leaving these out is always safe.
      AI_ENGINE: ${AI_ENGINE:-mock}
      AI_ENGINE_API_KEY: ${AI_ENGINE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      # This service owns migrations + seed on boot.
      RUN_MIGRATIONS: "true"
    volumes:
      - storagedata:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./apps/api
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -l info
    environment:
      APP_ENV: local
      API_SECRET_KEY: dev-local-secret-change-me
      DATABASE_URL: postgresql+psycopg://rams:rams@postgres:5432/rams
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      STORAGE_PROVIDER: local
      STORAGE_DIR: /app/storage
      # AI engine: pass-through from the host shell so no YAML edit (and no key
      # written to a file) is needed to switch to real generation:
      #   AI_ENGINE=openai OPENAI_API_KEY=sk-... docker compose up
      # Defaults to the billing-free mock engine. Empty values are treated as
      # "unset" by the adapters, so leaving these out is always safe.
      AI_ENGINE: ${AI_ENGINE:-mock}
      AI_ENGINE_API_KEY: ${AI_ENGINE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      # The api runs migrations; the worker only waits for the DB.
      RUN_MIGRATIONS: "false"
    volumes:
      - storagedata:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # For LAN access, point at the host's IP, e.g. http://192.168.1.20:8000/api/v1
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  storagedata:
